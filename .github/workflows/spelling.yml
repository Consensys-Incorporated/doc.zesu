---
name: Check for spelling with vale

on:
  pull_request:
    branches:
      - main

jobs:
  vale:
    name: Spelling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Vale
        uses: Consensys-Incorporated/github-actions/docs-spelling-check@28327992dc4f4eeeee937abbaebf63f00f4f6068
        with:
          FILEPATHS: "docs"

